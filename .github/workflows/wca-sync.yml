name: WCA 成績自動同步

# 每兩個月自動抓 WCA 官方最新成績寫回資料庫。
# cron 為 UTC：每逢單數月（1,3,5,7,9,11）1 號 03:00 UTC ≈ 台北 11:00 執行。
on:
  schedule:
    - cron: '0 3 1 */2 *'
  workflow_dispatch: {}   # 保留手動觸發（GitHub 網頁按鈕），平時用不到

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 執行 WCA 同步
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WCA_SYNC_SECRET: ${{ secrets.WCA_SYNC_SECRET }}
        run: node scripts/wca-sync/sync.mjs
